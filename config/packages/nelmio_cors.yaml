nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['*'] # ou ['http://localhost:3000', 'http://127.0.0.1:3000']
        allow_headers: ['Content-Type', 'Authorization']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        max_age: 3600
    paths:
        '^/api/': ~